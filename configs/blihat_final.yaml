# Blihat final configuration (frozen 2026-10-09 after the scale-subset ablation, see below).
# = adaptive_fine_box.yaml + fine_scale_lock. Do not tune further on UAV123.
# Ablation, UAV123 scale subset (24 seqs, first 300 frames), success AUC / precision:
#   coarse only (box_source=dino) 0.564 / 0.813
#   + LightGlue box               0.611 / 0.807
#   + scale lock (this file)      0.618 / 0.822   <- final
#   + crop 3.0                    0.609 / 0.830
#   + crop 3.0, inliers>=20, size>=12px  0.609 / 0.821
# adaptive_recovery.yaml + split roles: DINOv3 tracks (where), SuperPoint+LightGlue gives the box.
# The output box is the LightGlue fit (frame-1 box through anchor/keyframe matches) whenever the
# fit passes a reliability check; otherwise the DINO box. Diff vs adaptive_recovery.yaml: "# FINE".
# Needs: pip install git+https://github.com/cvg/LightGlue.git
backbone:
  name: "dinov3_vitl16"
device: "cuda"
adaptive:
  # Coarse (DINO)
  template_patches: 12
  template_scale: 2.0
  search_scale: 5.0            # CHANGED 4.0 -> 5.0: peak can land +-1.83x target size from the prediction (was +-1.33x)
  max_search_scale: 8.0        # CHANGED 6.0 -> 8.0
  widen_factor: 1.25
  widen_patience: 1            # CHANGED 3 -> 1: widen on the first bad frame
  kernel_margin: 1
  context_weight: 0.3
  fg_mask: true
  fg_mask_floor: 0.3
  window_weight: 0.15          # CHANGED 0.3 -> 0.15: weaker pull towards the predicted center
  scales: [0.9639, 1.0, 1.0375]
  scale_penalty: 0.9745
  scale_lr: 0.59
  # Memory
  memory_weights: [0.3, 0.3, 0.4]
  long_lr: 0.05
  short_len: 3
  stats_window: 30
  q_min: 0.8
  id_min: 0.85
  dino_only_strength: 0.5
  # Fine (SuperPoint + LightGlue keyframes)
  fine_enabled: true           # FINE
  max_keypoints: 1024
  target_norm_px: 160
  fine_crop_scale: 2.0
  num_keyframes: 2
  keyframe_interval: 10
  min_inliers: 8
  ransac_threshold: 3.0
  agree_radius: 1.5
  agree_scale_tol: 1.25
  fine_size_lr: 0.5            # ("agree" mode only)
  # Box source                   # FINE: whole block
  box_source: "fine"           # "agree" (old gate) | "fine" (LightGlue box, DINO fallback) | "dino" (fine logged only)
  fine_min_inliers: 10         # reliability: RANSAC inliers
  fine_min_inlier_ratio: 0.3   # reliability: inliers / matches
  fine_max_scale_step: 1.2     # max size change vs previous box per frame (compounds over frames without a fine box)
  fine_scale_step_frames: 2    # FINAL: allowed size change capped at 1.2**2 = 1.44x
  fine_scale_lock: true        # FINAL: the size check never switches off (fixes the shrinking-box loop)
  fine_max_offset: 0.75        # max fit center offset from the DINO center, in target sizes
  fine_box_size_lr: 1.0        # 1 = size straight from LightGlue
  fine_memory_obs: "search"    # DINO memory learns the search-grid window at the fine box
  redetect_fine: "refine"      # re-detected jumps take the LightGlue box when its fit is reliable
  # Motion
  velocity_smoothing: 3
  motion_min_history: 1        # NEW: use velocity from the 2nd tracked frame (was 2 samples)
  motion_coast_frames: 5       # NEW: keep extrapolating through up to 5 low-quality frames
  velocity_decay: 0.8          # NEW
  # Recovery
  widen_single_scale: true     # NEW: widened search uses scale 1.0 only (keeps FPS bounded)
  stats_mode: "healthy"        # NEW: medians from healthy frames, so a lost tracker can't call a distractor "healthy"
  stats_leak_every: 10         # NEW
  redetect: true               # NEW: tiled re-detection while lost
  redetect_patience: 5
  redetect_interval: 5
  redetect_grid: 3             # 3x3 tiles ~ 11x target size per axis at search_scale 5
  redetect_batch: 3
  redetect_q_min: 0.85
  redetect_id_min: 0.85
